# Install only after the certificate has been issued.
server {
    listen 80;
    server_name essmote.com www.essmote.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aiw-acme;
    }

    location / {
        return 301 https://www.essmote.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name essmote.com;

    ssl_certificate /etc/letsencrypt/live/essmote-apex/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/essmote-apex/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.essmote.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.essmote.com;

    ssl_certificate /etc/letsencrypt/live/www.essmote.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.essmote.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
